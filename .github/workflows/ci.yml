name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: pytest
      - name: Demo builds and serves
        run: |
          acta demo --data-dir /tmp/acta-demo
          ACTA_DATA_DIR=/tmp/acta-demo acta serve --port 8765 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/health-summary && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/ | grep -q "<title>"
